# Supabase pauses free projects after about a week with no API traffic.
# During the off-season nobody opens the app for weeks, so this pings it twice a week.
# Set two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (same values as the Vercel env).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 11 * * 1,4'   # Mondays and Thursdays, 11:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=key&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
